<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial;
            background-color: rgb(53, 51, 51);
        }
      
        #products {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-evenly;
            width: 100%;
        }

        #products div {
            width:250px;
            height:400px;
            text-align: center;
            background-color: white;
            border-radius: 10px;
            margin: 5px;
            padding: 5px;
        }

        #products div img {
            text-align: center;
            width: 100%;
        }
        #description {
            width: 200%;
            height: 100px;
            border:1px solid black;
            background-color: white;
            margin: 10px;
        } 
        #btn{
            width: 30px;
            height: 30px;
            background-color: black;
            color: white;
            border-radius: 5px;
            margin-top: 10px;
        }
    </style>
</head>

<body>
        <div id="products" >
    </div>
 <div id="description"> 

 </div>
 <button id ="btn">&#10005</button>

    <script>
        function genui(products) {
                products.forEach(function (product) {
                var productItem = document.createElement("div")
                
                var productImg = document.createElement("img")
                productImg.src = product.thumbnail
                productItem.appendChild(productImg)
                document.getElementById('products').appendChild(productItem)
                var productTitle = document.createElement("h3")
                productTitle.innerText = product.title
                productItem.appendChild(productTitle)
                // productItem.addEventListener("click", function () {
                //     document.getElementById("description").innerHTML = ""
                //     var productDiv = document.createElement("div")
                //     productDiv.innerHTML = "<h3>" + product.title + "</h3><p>" + product.description + "</p>"
                //     document.getElementById("description").appendChild(productDiv) 

                    
        
                // })
            })
        }
      
function getProducts() {
            fetch("https://dummyjson.com/product")
            .then(function(res){return res.json()})    
            .then(function (data) { genui(data.products); })
        }
       
        getProducts()
        
    </script>
</body>

</html>
